 g.save();g.beginPath();g.rect(px,py,pw,ph);g.clip();
 // Offset masonry with low contrast so the characters remain readable.
 for(let row=0,y=py; y<py+ph+34;row++,y+=34){
  for(let x=px-48+(row%2)*36;x<px+pw;x+=72){

 // Thick carved stone pillars and uneven blocks on both sides.

 // Lit rim and carved stone base.
 g.strokeStyle='#d642ff';g.shadowColor='#c32aff';g.shadowBlur=16;g.lineWidth=3;g.beginPath();g.moveTo(px,py);g.lineTo(px+pw,py);g.stroke();g.shadowBlur=0;
