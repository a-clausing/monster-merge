  ['FIRST STEPS','Encounter 10 monsters',total,10,'⚔️'],
  ['DUNGEON REGULAR','Encounter 100 monsters',total,100,'🛡️'],
  ['MONSTER MASTER','Encounter 1,000 monsters',total,1000,'👑'],
  ['THE ORC AWAKENS','Discover the Orc',discovered[4]?1:0,1,'🐗'],
  ['THE DRAGON RISES','Discover the Dragon',discovered[9]?1:0,1,'🐉'],
  ['THE FORGOTTEN ONE','Discover the final monster',discovered[10]?1:0,1,'🔮'],

 ];

 }
}

function drawLockedMonster(ctx,x,y,r,i){
 ctx.save();
 ctx.fillStyle='#211a2e';ctx.strokeStyle='#7b568e';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.arc(x,y,r-4,0,Math.PI*2);ctx.clip();
 ctx.fillStyle='#08070d';
 // Distinct horned shadow silhouettes conceal undiscovered creatures.
 const horns=i%3;
 ctx.beginPath();
 if(horns===0){ctx.moveTo(x-18,y-8);ctx.lineTo(x-25,y-32);ctx.lineTo(x-8,y-19);ctx.lineTo(x+8,y-19);ctx.lineTo(x+25,y-32);ctx.lineTo(x+18,y-8)}
 else if(horns===1){ctx.moveTo(x-20,y-6);ctx.lineTo(x-30,y-23);ctx.lineTo(x-12,y-17);ctx.lineTo(x,y-29);ctx.lineTo(x+12,y-17);ctx.lineTo(x+30,y-23);ctx.lineTo(x+20,y-6)}
 else{ctx.moveTo(x-19,y-8);ctx.lineTo(x-13,y-30);ctx.lineTo(x-3,y-20);ctx.lineTo(x+13,y-31);ctx.lineTo(x+20,y-8)}
 ctx.lineTo(x+24,y+30);ctx.lineTo(x-24,y+30);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.ellipse(x,y+2,19,23,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#4f3468';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(x-9,y+2);ctx.lineTo(x-3,y+4);ctx.moveTo(x+9,y+2);ctx.lineTo(x+3,y+4);ctx.stroke();
 ctx.restore();
}
function showMonsterDetail(i){
 const canvas=document.getElementById('monsterDetail'),ctx=canvas.getContext('2d');
 canvas.classList.add('open');
 document.getElementById('bestiaryClose').textContent='← Back to Evolution';
 ctx.clearRect(0,0,440,570);ctx.fillStyle='#120b21';ctx.fillRect(0,0,440,570);

 const art=monsterArt[i],r=112,x=220,y=225;
 if(discovered[i]&&art&&art.complete&&art.naturalWidth){
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  const side=Math.min(art.naturalWidth,art.naturalHeight);
  ctx.drawImage(art,(art.naturalWidth-side)/2,(art.naturalHeight-side)/2,side,side,x-r,y-r,r*2,r*2);ctx.restore();
 }else if(discovered[i]){
  ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 }else{ctx.save();ctx.translate(x,y);ctx.scale(r/34,r/34);drawLockedMonster(ctx,0,0,34,i);ctx.restore()}
 ctx.fillStyle='#4b365e';ctx.fillRect(48,370,344,2);
 ctx.font='bold 19px Georgia';ctx.fillStyle='#f6ddb1';
 ctx.fillText('TOTAL ENCOUNTERED',220,412);
 ctx.font='bold 46px Georgia';ctx.fillStyle='#e6b9ff';
 ctx.fillText((monsterStats.dropped[i]+monsterStats.created[i]).toLocaleString(),220,465);
 ctx.font='13px Georgia';ctx.fillStyle='#bfa6cb';
 ctx.fillText('All monsters dropped or created through merging',220,493);
 ctx.font='14px Georgia';ctx.fillStyle='#d7b2ef';
 ctx.fillText(discovered[i]?'DISCOVERED':'LOCKED • MERGE TO REVEAL',220,524);
 ctx.font='12px Georgia';ctx.fillStyle='#a68db5';ctx.fillText('Tap the card or Back to return',220,547);
}

function drawBestiary(){
 const legend=document.getElementById('legendCanvas'),ctx=legend.getContext('2d');
 ctx.clearRect(0,0,440,570);ctx.fillStyle='#120b21';ctx.fillRect(0,0,440,570);

 ctx.font='13px Georgia';ctx.fillStyle='#c3a6d2';ctx.fillText('DISCOVER MONSTERS BY MERGING',220,66);
 // Draw the original monster images directly into the separate legend canvas.
 const cols=3;
 for(let i=0;i<11;i++){
  const col=i%cols,row=Math.floor(i/cols),x=78+col*142,y=116+row*112,r=34;
  const art=monsterArt[i];
  if(discovered[i]){
   if(art&&art.complete&&art.naturalWidth){
    ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
    const side=Math.min(art.naturalWidth,art.naturalHeight);
    ctx.drawImage(art,(art.naturalWidth-side)/2,(art.naturalHeight-side)/2,side,side,x-r,y-r,r*2,r*2);ctx.restore();
   }else{ctx.fillStyle=colors[i];ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
   ctx.fillStyle='#f4d7ac';ctx.font='bold 13px Georgia';ctx.fillText((i+1)+'. '+names[i],x,y+52);
  }else{
   drawLockedMonster(ctx,x,y,r,i);
   ctx.fillStyle='#a58db8';ctx.font='bold 13px Georgia';ctx.fillText((i+1)+'. ???',x,y+52);
  }
 }
 ctx.fillStyle='#bfa6cb';ctx.font='12px Georgia';ctx.fillText('TAP A MONSTER TO VIEW DETAILS',220,552);
}
